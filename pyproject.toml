[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stata-registry"
version = "0.4.0"
description = "Stata command registry: canonical names, abbreviations, categories, and source drivers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.1"]

[project.urls]
Homepage = "https://github.com/randrescastaneda/stata-command-registry"
Issues = "https://github.com/randrescastaneda/stata-command-registry/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["stata_registry*"]

[tool.setuptools.package-data]
stata_registry = ["data/*.yaml"]
